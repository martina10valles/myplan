<title>My plan</title>
<style>*,*::before,*::after{box-sizing:border-box;border:0 solid}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F4F3F8}
h1,h2,h3,p{margin:0}
button{background:transparent;padding:0;font:inherit;color:inherit;margin:0;touch-action:manipulation}
input,textarea,select{margin:0;font:inherit;color:inherit}
textarea{display:block}
@supports (-webkit-touch-callout:none){input,textarea,select{font-size:16px!important}}
.flex{display:flex}
.flex-col{flex-direction:column}
.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}
.items-end{align-items:flex-end}
.items-start{align-items:flex-start}
.items-baseline{align-items:baseline}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
</style>
